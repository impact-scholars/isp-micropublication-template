name: Publish Paper

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write
  deployments: write

jobs:
  validate:
    uses: impact-scholars/isp-actions-config/.github/workflows/validate-paper.yml@main

  preview:
    needs: validate
    if: github.event_name == 'pull_request'
    uses: impact-scholars/isp-actions-config/.github/workflows/deploy-paper.yml@main
    with:
      target: cloudflare
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    uses: impact-scholars/isp-actions-config/.github/workflows/deploy-paper.yml@main
    with:
      target: pages
      base_url: /${{ github.event.repository.name }}
